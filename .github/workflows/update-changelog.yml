name: "Update Changelog"

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      # main requires verified signatures, so the commit is created through the
      # GraphQL API. Commits made that way are signed with GitHub's own key.
      - name: Commit updated CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, nothing to commit."
            exit 0
          fi

          gh api graphql \
            -f query='
              mutation($repo: String!, $branch: String!, $oid: GitObjectID!, $path: String!, $contents: Base64String!) {
                createCommitOnBranch(input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch }
                  expectedHeadOid: $oid
                  message: { headline: "Update CHANGELOG" }
                  fileChanges: { additions: [{ path: $path, contents: $contents }] }
                }) {
                  commit { oid }
                }
              }' \
            -f repo="${GITHUB_REPOSITORY}" \
            -f branch=main \
            -f oid="$(git rev-parse HEAD)" \
            -f path=CHANGELOG.md \
            -f contents="$(base64 -w0 CHANGELOG.md)"
